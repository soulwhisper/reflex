---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: docker

on:
  push:
    tags: ["v*", "[0-9]*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing (Sigstore OIDC)

concurrency:
  # A cancelled run can leave untagged per-arch digests in GHCR (harmless —
  # no manifest points at them); the merge job updates tags atomically.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native runners per arch (ubuntu-24.04-arm is free for public repos):
  # no QEMU, ~85min emulated arm64 leg drops to minutes.
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      # Push by digest only — tagging happens in the merge job once all
      # arch legs are done.
      # outputs must be ONE unquoted line: the action passes each line to
      # buildx verbatim (no comma splitting), and buildx's CSV parser rejects
      # the doc-style quoted form ("failed to parse ref push-by-digest=true")
      - name: Build & push (native, by digest, gha cache)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CHECKPOINTS=english
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest, sign, scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # On push of v0.1.0: tags "0.1.0", "0.1", "latest" (bare 0.1.0 too)
          # On workflow_dispatch from main: tag "main"
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create manifest index & push
        working-directory: /tmp/digests
        run: |
          refs=""
          for f in *; do refs="$refs ghcr.io/${GITHUB_REPOSITORY}@sha256:$f"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $refs

      - name: Resolve index digest
        id: index
        run: |
          ref=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .}}' | jq -r '.manifest.digest // empty')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image digest summary
        run: |
          echo "## Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.index.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing of the merged index; fall back to the tag reference
      # if digest resolution came back empty.
      - name: Sign image (cosign keyless, by digest)
        run: |
          target="${{ steps.index.outputs.ref }}"
          if [ -n "${{ steps.index.outputs.digest }}" ]; then
            target="${target%:*}@${{ steps.index.outputs.digest }}"
          fi
          cosign sign --yes "$target"

      # Blocking scan of the published image on releases only; the image is
      # already pushed and signed by this point, so a failure means triage
      # and either patch or yank the tag.
      - name: Trivy scan of the published image
        if: github.ref_type == 'tag'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: table
          exit-code: "1" # fail the release on CRITICAL/HIGH findings
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
