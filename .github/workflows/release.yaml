---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # ci-typed pushes (renovate github-action/dockerfile maintenance, workflow
    # fixes) are never release-worthy — skip the no-op run. Squash-only merging
    # makes the tip commit the whole PR, so a feat/fix tip still runs.
    # release-please's own "chore(main): release" commits don't match — safe.
    if: ${{ !startsWith(github.event.head_commit.message, 'ci') }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
