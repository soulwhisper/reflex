---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. when a PR branch is re-pushed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app finetune

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyyaml

      - name: Compile check
        run: python -m compileall app finetune

      - name: Policy schema loads
        run: |
          python - <<'EOF'
          from app.config import load_policies
          p = load_policies("policies/routes.yaml")
          assert {"mcp", "tool", "profile"} <= set(p), p.keys()
          for name, pol in p.items():
              q = pol.question()
              assert q[name]["type"] in {"choice", "score", "noul"}, name
              assert q[name]["criteria"], name
          print("policies OK:", sorted(p))
          EOF

      - name: Docker build (baked weights)
        run: docker build -t reflex:ci .

  # Single required-status-check target for branch protection: require only
  # `ci-pass` and new jobs keep protection working without edits.
  ci-pass:
    name: CI checks passed
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        # `needs` defaults to requiring success; `if: always()` above means
        # this runs even when a dependency was skipped — explicit guard.
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.build.result }}" != "success" \
            ]]; then
            echo "::error::One or more required CI jobs did not succeed"
            echo "lint=${{ needs.lint.result }}"
            echo "build=${{ needs.build.result }}"
            exit 1
          fi
          echo "CI checks passed"
